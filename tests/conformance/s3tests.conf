# Ceph s3-tests configuration for a local S3Harp started by run.sh.
# S3Harp authenticates one root keypair, so every section shares it.

[DEFAULT]
host = 127.0.0.1
port = 18080
is_secure = False
ssl_verify = False

[fixtures]
bucket prefix = s3harp-{random}-
iam name prefix = s3-tests-
iam path prefix = /s3-tests/

[s3 main]
display_name = S3Harp Tester
user_id = s3harptester
email = tester@example.com
api_name = default
access_key = S3HARPCONFORMANCEKEY
secret_key = s3harpconformancesecrets3harpconformance

[s3 alt]
display_name = S3Harp Alt
user_id = s3harpalt
email = alt@example.com
access_key = S3HARPCONFORMANCEKEY
secret_key = s3harpconformancesecrets3harpconformance

[s3 tenant]
display_name = S3Harp Tenant
user_id = s3harptenant
email = tenant@example.com
access_key = S3HARPCONFORMANCEKEY
secret_key = s3harpconformancesecrets3harpconformance
tenant = testx

[iam]
display_name = S3Harp IAM
user_id = s3harpiam
email = iam@example.com
access_key = S3HARPCONFORMANCEKEY
secret_key = s3harpconformancesecrets3harpconformance

[iam root]
user_id = s3harproot
email = root@example.com
access_key = S3HARPCONFORMANCEKEY
secret_key = s3harpconformancesecrets3harpconformance

[iam alt root]
user_id = s3harpaltroot
email = altroot@example.com
access_key = S3HARPCONFORMANCEKEY
secret_key = s3harpconformancesecrets3harpconformance
