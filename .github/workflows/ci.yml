name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build s3harp.slnx --configuration Release
      - name: Test
        run: dotnet test s3harp.slnx --configuration Release --no-build -- --report-gh

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The Python dependencies come from the s3-tests checkout run.sh
          # makes, so the cache follows the revision run.sh pins.
          cache-dependency-glob: tests/conformance/run.sh
      - name: Build
        run: dotnet build src/S3Harp.Server --configuration Release
      - name: Run Ceph s3-tests
        run: tests/conformance/run.sh
      - name: Show server log
        if: failure()
        run: tail -n 200 .conformance/server.log

